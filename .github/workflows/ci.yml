name: CI

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test -- --coverageReporters=json-summary --coverageReporters=text

      - name: Convert coverage to CSV
        run: node scripts/coverage-to-csv.js

      - name: Commit coverage CSV report
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add coverage-report.csv
          git diff --cached --quiet || git commit -m "chore: update coverage report [skip ci]"
          git push
